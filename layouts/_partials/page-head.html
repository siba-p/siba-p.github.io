<header class="page-head">
  <img class="lattice" src="{{ "img/lattice.svg" | relURL }}" alt="" aria-hidden="true">
  <div class="wrap">
    <p class="eyebrow">{{ .Params.eyebrow | default .Section | safeHTML }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.lead }}<p class="lead">{{ . | markdownify }}</p>{{ end }}
  </div>
</header>
