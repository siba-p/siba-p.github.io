{{- $id := . -}}
<svg class="vol-art" viewBox="0 0 200 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
{{- if eq $id "math" }}
  <g stroke="currentColor" stroke-width="1" opacity=".22">{{ range $i := seq 0 10 }}<line x1="{{ mul $i 20 }}" y1="0" x2="{{ mul $i 20 }}" y2="260"/>{{ end }}{{ range $i := seq 0 13 }}<line x1="0" y1="{{ mul $i 20 }}" x2="200" y2="{{ mul $i 20 }}"/>{{ end }}</g>
  <path d="M0 150 C 30 60, 60 60, 90 130 S 150 220, 200 110 L200 260 L0 260 Z" fill="currentColor" opacity=".16"/>
  <path d="M0 150 C 30 60, 60 60, 90 130 S 150 220, 200 110" fill="none" stroke="currentColor" stroke-width="2.6" opacity=".9"/>
  <path d="M10 40 L120 140" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" opacity=".7"/>
  <circle cx="54" cy="80" r="5" fill="currentColor"/>
{{- else if eq $id "python" }}
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".5">{{ range $i := seq 0 7 }}<path d="M{{ add 24 (mul (mod $i 3) 12) }} {{ add 40 (mul $i 26) }}h{{ add 40 (mul (mod (mul $i 7) 5) 22) }}"/>{{ end }}</g>
  <g fill="none" stroke="currentColor" stroke-width="3" opacity=".9"><path d="M120 60 l40 40 -40 40"/><path d="M110 170h60"/></g>
{{- else if eq $id "sim" }}
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity=".35"><rect x="30" y="40" width="140" height="140"/><rect x="0" y="40" width="30" height="140"/><rect x="170" y="40" width="30" height="140"/></g>
  <g fill="currentColor">{{ range $i := seq 0 13 }}<circle cx="{{ add 42 (mod (mul $i 37) 120) }}" cy="{{ add 54 (mod (mul $i 53) 112) }}" r="7" opacity=".8"/>{{ end }}</g>
  <path d="M10 225c20-18 40 10 60-6s40 12 60-4 40 8 60-6" fill="none" stroke="currentColor" stroke-width="2" opacity=".7"/>
{{- else if eq $id "computing" }}
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55">
    <rect x="62" y="96" width="76" height="76" rx="8"/><rect x="82" y="116" width="36" height="36" rx="4"/>
    <path d="M76 96V60h-30M100 96V40M124 96V70h40M138 112h34v-40M138 134h50M138 156h24v50M124 172v40h30M100 172v70M76 172v26H30M62 156H20M62 134H40v-56M62 112H10"/>
  </g>
  <g fill="currentColor" opacity=".8"><circle cx="46" cy="60" r="4"/><circle cx="100" cy="40" r="4"/><circle cx="164" cy="70" r="4"/><circle cx="172" cy="72" r="0"/><circle cx="188" cy="134" r="4"/><circle cx="162" cy="206" r="4"/><circle cx="154" cy="212" r="4"/><circle cx="30" cy="198" r="4"/><circle cx="20" cy="156" r="4"/><circle cx="40" cy="78" r="4"/><circle cx="10" cy="112" r="4"/></g>
{{- else if eq $id "ml" }}
  <g stroke="currentColor" stroke-width="1.3" opacity=".4">
    {{- range $i := seq 0 3 }}{{ range $j := seq 0 4 }}<line x1="30" y1="{{ add 50 (mul $i 55) }}" x2="100" y2="{{ add 30 (mul $j 50) }}"/>{{ end }}{{ end }}
    {{- range $i := seq 0 4 }}{{ range $j := seq 0 2 }}<line x1="100" y1="{{ add 30 (mul $i 50) }}" x2="170" y2="{{ add 80 (mul $j 50) }}"/>{{ end }}{{ end }}
  </g>
  <g fill="currentColor">{{ range $i := seq 0 3 }}<circle cx="30" cy="{{ add 50 (mul $i 55) }}" r="9" opacity=".85"/>{{ end }}{{ range $i := seq 0 4 }}<circle cx="100" cy="{{ add 30 (mul $i 50) }}" r="9" opacity=".7"/>{{ end }}{{ range $i := seq 0 2 }}<circle cx="170" cy="{{ add 80 (mul $i 50) }}" r="9" opacity=".85"/>{{ end }}</g>
{{- else if eq $id "science" }}
  <g fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55">
    <ellipse cx="100" cy="120" rx="80" ry="28"/><ellipse cx="100" cy="120" rx="80" ry="28" transform="rotate(60 100 120)"/><ellipse cx="100" cy="120" rx="80" ry="28" transform="rotate(-60 100 120)"/>
    <path d="M10 222c15-30 30-30 45 0s30 30 45 0 30-30 45 0 30 30 45 0" stroke-width="2"/>
  </g>
  <g fill="currentColor"><circle cx="100" cy="120" r="12" opacity=".9"/><circle cx="180" cy="120" r="5"/><circle cx="60" cy="51" r="5"/><circle cx="60" cy="189" r="5"/></g>
{{- else }}
  <g fill="none" stroke="currentColor" stroke-width="1.5" opacity=".45">
    {{- range $r := seq 0 4 }}{{ range $q := seq 0 3 }}{{ $x := add 20 (add (mul $q 52) (mul (mod $r 2) 26)) }}{{ $y := add 30 (mul $r 45) }}<path d="M{{ $x }} {{ $y }}l26-15 26 15v30l-26 15-26-15z"/>{{ end }}{{ end }}
  </g>
  <g fill="currentColor" opacity=".85">{{ range $r := seq 0 4 }}{{ range $q := seq 0 3 }}<circle cx="{{ add 46 (add (mul $q 52) (mul (mod $r 2) 26)) }}" cy="{{ add 45 (mul $r 45) }}" r="4"/>{{ end }}{{ end }}</g>
{{- end }}
</svg>
