{{- $p := .page -}}
<li>
  <a class="lp-lesson" href="{{ $p.RelPermalink }}" data-learn-slug="{{ $p.File.ContentBaseName }}">
    <span class="lp-body">
      <b>{{ $p.Title }}</b>
      <span>{{ $p.Description }}</span>
      <span class="lp-tags"><span class="lvl lvl-{{ lower $p.Params.level }}">{{ $p.Params.level }}</span>{{ with $p.Params.lab }}<span class="lp-lab">{{ . }}</span>{{ end }}</span>
    </span>
    <span class="lp-done" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
  </a>
</li>
