{{- $p := .page -}}
<li>
  <a class="lp-lesson" href="{{ $p.RelPermalink }}" data-learn-slug="{{ $p.File.ContentBaseName }}">
    <span class="lp-num">{{ .num }}</span>
    <span class="lp-body">
      <b>{{ $p.Title }}</b>
      <span>{{ $p.Description }}</span>
      <span class="lp-tags"><span class="lvl lvl-{{ lower $p.Params.level }}">{{ $p.Params.level }}</span><span>{{ $p.Params.minutes }} min</span>{{ with $p.Params.lab }}<span class="lp-lab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/></svg>{{ . }}</span>{{ end }}</span>
    </span>
    <span class="lp-done" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
  </a>
</li>
