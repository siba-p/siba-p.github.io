# Add new papers anywhere in "items". "me" is bolded automatically in author lists.
# status: published | workshop | review | preparation
# lane: which research thread the paper belongs to (see "lanes"); builds_on: keys of earlier papers it extends.
# image: thumbnail shown on the card (path under static/). takeaway: one-line plain-language result.
me: "S. Panigrahy"

lanes:
  - id: ff
    name: "Force fields"
  - id: crowd
    name: "Crowding & DNA"
  - id: np
    name: "Nanoparticle interfaces"
  - id: ml
    name: "ML & inverse design"

items:
  - key: panigrahy2023pccp
    status: published
    year: 2023
    lane: ff
    authors: ["S. Panigrahy", "R. Sahu", "S. K. Reddy", "D. Nayar"]
    title: "Structure, energetics and dynamics in crowded amino acid solutions: a molecular dynamics study"
    venue: "Physical Chemistry Chemical Physics"
    short_venue: "PCCP"
    volume: "25"
    pages: "5430–5442"
    doi: "10.1039/d2cp04238j"
    image: "img/crowded-aa.jpg"
    takeaway: "A one-parameter NBFIX correction removes artificial aggregation and recovers experimental osmotic coefficients, viscosities and diffusivities."
    tags: ["force fields", "NBFIX", "crowding"]

  - key: panigrahy2024jcp
    status: published
    year: 2024
    lane: np
    builds_on: [panigrahy2023pccp]
    authors: ["S. Panigrahy", "D. Nayar"]
    title: "Differential local ordering of mixed crowders determines effective size and stability of ss-DNA capped gold nanoparticle"
    venue: "The Journal of Chemical Physics"
    short_venue: "J. Chem. Phys."
    volume: "160"
    pages: "014901"
    doi: "10.1063/5.0179238"
    image: "img/dna-aunp-box.jpg"
    takeaway: "Small crowders act through soft, direct adsorption rather than depletion; a glycine + serine mixture gives the largest particle radius."
    tags: ["gold nanoparticles", "DNA", "Kirkwood–Buff"]

  - key: rajput2024crowding
