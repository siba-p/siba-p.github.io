    lane: crowd
    builds_on: [panigrahy2023pccp]
    authors: ["S. Rajput", "S. Panigrahy", "D. Nayar"]
    title: "In Silico View of Crowding: Biomolecular Processes to Nanomaterial Design"
    venue: "ACS Omega"
    short_venue: "ACS Omega"
    volume: "9"
    pages: "29953–29965"
    doi: "10.1021/acsomega.4c03344"
    image: "img/dna-aunp-crowded.jpg"
    takeaway: "A review of how simulation has reshaped our picture of crowding, from protein folding to nanomaterial design."
    tags: ["review", "crowding", "nanomaterials"]

  - key: panigrahy2025neurips
    status: workshop
    year: 2025
    lane: ml
    authors: ["S. Panigrahy", "A. James", "D. Nayar"]
    title: "Data-driven prediction of polymer surface adhesion using high-throughput MD and hybrid network models"
    venue: "AI for Accelerated Materials Design (AI4Mat) Workshop, NeurIPS"
    short_venue: "NeurIPS AI4Mat"
    image: "img/thumb-neurips.jpg"
    takeaway: "A CNN–GRU–attention network trained on about 470k umbrella-sampling runs predicts full adhesion free-energy profiles."
