# The Learn section: four courses, each divided into parts. A lesson in content/learn/ names its
# part with `track:`; its order inside the part is `weight`. Lessons are numbered within a course.
- id: computing
  n: 1
  slug: computing
  title: "Computing for scientists"
  short: "Computing"
  tone: teal
  icon: chip
  level: "Start here"
  blurb: "What actually happens inside a computer, how Linux and the shell are built, and the two languages of scientific computing, Python and Fortran. No prior experience assumed."
  parts:
    - id: machine
      title: "How a computer works"
      blurb: "Processor, memory and the way numbers are stored: the hardware every simulation runs on."
    - id: toolbox
      title: "Linux and the shell"
      blurb: "The operating system, layer by layer, and the command line that drives it, from your laptop to a supercomputer."
    - id: code
      title: "Programming"
      blurb: "Python for analysis and machine learning, Fortran for the fastest numerical codes."
- id: ml
  n: 2
  slug: machine-learning
  title: "Machine learning, from the neuron up"
  short: "Machine learning"
  tone: indigo
  icon: curve
  level: "Foundations"
  blurb: "Starting from one artificial neuron and building, picture by picture, to deep networks, uncertainty, graph networks and transformers."
  parts:
    - id: neuron
      title: "The neuron"
      blurb: "One neuron, how it learns, how layers of neurons bend space, and how backpropagation assigns the blame."
    - id: ml
      title: "Learning from data"
      blurb: "Fitting, optimisation, generalisation, practical neural networks and honest uncertainty."
    - id: arch
      title: "Architectures"
      blurb: "Networks for graphs and sequences: message passing and attention."
- id: science
  n: 3
  slug: science
  title: "Molecular science and simulation"
  short: "Science"
  tone: gold
  icon: atoms
  level: "Foundations"
  blurb: "From particles, forces and momentum, through quantum energy levels and statistical mechanics, to molecular dynamics and the analysis of trajectories."
  parts:
    - id: physics
      title: "Particles and motion"
      blurb: "Position, velocity, momentum, energy and phase space; then why energy comes in quanta."
    - id: statmech
      title: "Statistical mechanics"
      blurb: "Counting microstates: entropy, temperature, the Boltzmann distribution and molecular speeds."
    - id: sim
      title: "Molecular simulation"
      blurb: "Potential energy surfaces, molecular dynamics and turning trajectories into trustworthy numbers."
- id: ai4mat
  n: 4
  slug: ai-for-materials
  title: "Machine learning for materials"
  short: "AI for materials"
  tone: rose
  icon: crystal
  level: "Advanced"
  blurb: "Where courses 2 and 3 meet: descriptors, crystal graphs, interatomic potentials, differentiable simulation, generative models and closed-loop discovery."
  parts:
    - id: ai4mat
      title: "Machine learning for materials"
      blurb: "Each lesson assumes the neuron and simulation courses."
