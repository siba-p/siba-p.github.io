# The Learn section: subjects, each divided into themes. A topic in content/learn/ names its theme
# with `track:`; `weight` orders topics inside a theme. There is no fixed reading order across
# subjects: topics declare what they build on (`prereqs:`) and topic pages list what builds on them.
# Themes with no topics yet are hidden.
- id: math
  n: 1
  slug: mathematics
  title: "Mathematics for science"
  short: "Mathematics"
  mark: "Maths"
  tone: violet
  icon: curve
  level: "Foundations"
  blurb: "The mathematics used throughout simulation and machine learning, developed from first principles: functions and calculus, linear algebra and gradients, and probability."
  parts:
    - id: calc
      title: "Calculus"
      blurb: "Functions, derivatives, Taylor series, integrals and numerical approximation."
    - id: linalg
      title: "Linear algebra and many variables"
      blurb: "Vectors, matrices as linear maps, eigenvectors, partial derivatives, gradients and the Hessian."
    - id: chance
      title: "Probability and statistics"
      blurb: "Random variables, distributions, expectation and variance, the central limit theorem and Bayes' theorem."
- id: computing
  n: 2
  slug: computing
  title: "Computers, Linux and compiled code"
  short: "Computing"
  mark: "Computing"
  tone: teal
  icon: chip
  level: "Foundations"
  blurb: "How a computer executes a program and stores numbers, how Linux and the shell work, and how compiled code is written for numerical work."
  parts:
    - id: machine
      title: "Computer architecture"
      blurb: "The fetch–decode–execute cycle, the memory hierarchy, integers and IEEE 754 floating point."
    - id: toolbox
      title: "Linux and the shell"
      blurb: "Kernel, system calls and processes; how bash parses a command; files, pipes, scripting and cluster job scheduling."
    - id: code
      title: "Compiled languages"
      blurb: "Fortran for numerical kernels: types, arrays, modules, compilation and parallelism."
- id: python
  n: 3
  slug: python
  title: "Python for scientific computing"
  short: "Python"
  mark: "Python"
  tone: sky
  icon: code
  level: "Foundations"
  blurb: "Python from the interpreter up: how source code runs, the object model, data structures and classes, then NumPy, scientific data and performance."
  parts:
    - id: pycore
      title: "The language"
      blurb: "Interpreter, objects and names, control flow, functions and scope, built-in collections and classes."
    - id: pysci
      title: "Scientific Python"
      blurb: "NumPy arrays and their memory layout, vectorisation and broadcasting, plotting and data files, and making code fast."
- id: ml
  n: 4
  slug: machine-learning
  title: "Machine learning"
  short: "Machine learning"
  mark: "Learning"
  tone: indigo
  icon: curve
  level: "Core"
  blurb: "Learning from data, from fitting a line to deep networks: optimisation, generalisation, kernels and Gaussian processes, neural networks and modern architectures."
  parts:
    - id: ml
      title: "Learning from data"
      blurb: "Models, loss functions and likelihood, gradient descent, generalisation, and kernels and Gaussian processes."
    - id: neuron
      title: "Neurons and networks"
      blurb: "The artificial neuron and logistic regression, multilayer networks as maps of space, backpropagation, and training deep networks in practice."
    - id: unsup
      title: "Structure without labels"
      blurb: "Dimensionality reduction and clustering."
    - id: arch
      title: "Architectures"
      blurb: "Convolutional networks, graph neural networks and transformers."
- id: science
  n: 5
  slug: science
  title: "Physics and statistical mechanics"
  short: "Statistical mechanics"
  mark: "Physics"
  tone: gold
  icon: atoms
  level: "Core"
  blurb: "The mechanics of particles and the statistical mechanics built on it: entropy and temperature, the Boltzmann distribution, ensembles and free energy, fluctuations, phase transitions and liquids."
  parts:
    - id: physics
      title: "Mechanics"
      blurb: "Newtonian and Hamiltonian mechanics, phase space, and quantised energy levels."
    - id: statmech
      title: "Statistical mechanics"
      blurb: "Entropy and temperature, the Boltzmann distribution, ensembles and free energy, fluctuations, phase transitions and liquid structure."
- id: sim
  n: 6
  slug: molecular-simulation
  title: "Molecular simulation"
  short: "Simulation"
  mark: "Simulation"
  tone: orange
  icon: atoms
  level: "Core"
  blurb: "How molecular simulations are built and analysed: potential energy surfaces and force fields, Monte Carlo, molecular dynamics, thermostats and barostats, and transport properties."
  parts:
    - id: models
      title: "Interaction models"
      blurb: "Potential energy surfaces and force fields; periodic boundaries, cut-offs, neighbour lists and long-range electrostatics."
    - id: sampling
      title: "Monte Carlo methods"
      blurb: "Importance sampling, the Metropolis algorithm and Monte Carlo in other ensembles."
    - id: dyn
      title: "Dynamics"
      blurb: "Molecular dynamics, numerical integration of the equations of motion, thermostats and barostats."
    - id: analysis
      title: "Analysis"
      blurb: "Structure, transport coefficients and statistical error from trajectories."
- id: rare
  n: 7
  slug: enhanced-sampling
  title: "Rare events, free energies and enhanced sampling"
  short: "Enhanced sampling"
  mark: "Sampling"
  tone: green
  icon: curve
  level: "Advanced"
  blurb: "Why important events are rare in simulations, and how to sample them anyway: energy landscapes and rates, free-energy methods, adaptive biasing, tempering, path sampling and machine-learned approaches."
  parts:
    - id: rl-land
      title: "Landscapes and rates"
      blurb: "Minima, saddles and minimum energy paths; why rare events are rare; transition-state theory and Kramers; collective variables."
    - id: rl-free
      title: "Free-energy calculations"
      blurb: "Perturbation, thermodynamic integration, BAR and MBAR, Jarzynski and Crooks, umbrella sampling and WHAM."
    - id: rl-bias
      title: "Adaptive biasing and tempering"
      blurb: "Metadynamics and its well-tempered form, OPES, variationally enhanced sampling, adaptive biasing force, replica exchange and accelerated MD."
    - id: rl-path
      title: "Paths and kinetics"
      blurb: "String methods, transition path sampling, interface and forward-flux sampling, milestoning, weighted ensemble and Markov state models."
    - id: rl-ml
      title: "Machine learning for sampling"
      blurb: "Learned collective variables (autoencoders, Deep-LDA, Deep-TICA, VAMPnets, SPIB) and generative samplers (Boltzmann generators, normalizing flows, diffusion models)."
- id: ai4mat
  n: 8
  slug: ai-for-materials
  title: "Machine learning for materials"
  short: "AI for materials"
  mark: "Materials"
  tone: rose
  icon: crystal
  level: "Advanced"
  blurb: "Machine learning for atomistic materials science: the history and theory of interatomic potentials, how to build and validate them, universal models, and generative and differentiable methods."
  parts:
    - id: found
      title: "Foundations"
      blurb: "Where interatomic potentials came from, what a machine-learned potential must learn, and how atomic environments are described."
    - id: mlmodels
      title: "Machine-learned interatomic potentials"
      blurb: "Kernel and linear models, atomic neural networks, message passing and equivariant networks."
    - id: practice
      title: "Training and using MLIPs"
      blurb: "Data, losses and validation; universal foundation models; building your own potential; active learning."
    - id: ai4mat
      title: "Generative and differentiable methods"
      blurb: "Crystal representations, generative models and differentiable simulation."
